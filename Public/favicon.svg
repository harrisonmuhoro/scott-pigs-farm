<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#8B1A1A"/>
  <!-- Pig body / head -->
  <ellipse cx="32" cy="34" rx="18" ry="16" fill="#f4a3a3"/>
  <!-- Pig snout -->
  <ellipse cx="32" cy="42" rx="9" ry="6" fill="#e07777"/>
  <!-- Nostrils -->
  <circle cx="28.5" cy="43" r="2" fill="#8B1A1A"/>
  <circle cx="35.5" cy="43" r="2" fill="#8B1A1A"/>
  <!-- Eyes -->
  <circle cx="25" cy="32" r="3" fill="#8B1A1A"/>
  <circle cx="39" cy="32" r="3" fill="#8B1A1A"/>
  <!-- Ear left -->
  <ellipse cx="18" cy="22" rx="6" ry="8" fill="#f4a3a3" transform="rotate(-15 18 22)"/>
  <ellipse cx="18" cy="22" rx="3.5" ry="5" fill="#e07777" transform="rotate(-15 18 22)"/>
  <!-- Ear right -->
  <ellipse cx="46" cy="22" rx="6" ry="8" fill="#f4a3a3" transform="rotate(15 46 22)"/>
  <ellipse cx="46" cy="22" rx="3.5" ry="5" fill="#e07777" transform="rotate(15 46 22)"/>
</svg>
